name: Validate
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gatekeeper_test
          POSTGRES_USER: gatekeeper
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gatekeeper -d gatekeeper_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure test databases
        run: echo "TEST_DATABASE_URL=postgres://gatekeeper:test-password@localhost:5432/gatekeeper_test?sslmode=disable" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make check
      - name: Use runner-provided Chrome for browser tests
        run: |
          browser_path="$(command -v google-chrome)"
          "$browser_path" --version
          echo "PLAYWRIGHT_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: npm run test:e2e
        working-directory: frontend
      - name: Validate Compose configuration
        env:
          GATEKEEPER_API_KEY: ci-only-gateway-key
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
          POSTGRES_PASSWORD: ci-only-postgres-password
          REDIS_PASSWORD: ci-only-redis-password
        run: docker compose config --quiet
      - name: Validate alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/prometheus/alerts.yml:/alerts.yml:ro" prom/prometheus:latest check rules /alerts.yml
