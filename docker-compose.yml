x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - GRAFANA_DOMAIN=${GRAFANA_DOMAIN:-grafana.localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
      '
    volumes:
      - redis-data:/data
    healthcheck:
      test: >
        sh -c '
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
          else
            redis-cli ping | grep -q PONG
          fi
        '
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    logging: *default-logging

  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_ID=backend-1
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8081/api/students",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    logging: *default-logging

  backend-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_ID=backend-2
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8081/api/students",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    logging: *default-logging

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_URLS=http://backend-1:8081,http://backend-2:8081
      - BACKEND_URL=http://backend-1:8081
      - REDIS_ADDR=redis:6379
      - PORT=8080
      - GATEKEEPER_API_KEY=${GATEKEEPER_API_KEY}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      - CIRCUIT_BREAKER_COOLDOWN=${CIRCUIT_BREAKER_COOLDOWN:-10s}
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9090/-/healthy",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
