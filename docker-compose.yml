services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_ID=backend-1
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8081/api/students",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  backend-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - BACKEND_ID=backend-2
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8081/api/students",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - BACKEND_URLS=http://backend-1:8081,http://backend-2:8081
      - BACKEND_URL=http://backend-1:8081
      - REDIS_ADDR=redis:6379
      - PORT=8080
      - GATEKEEPER_API_KEY=${GATEKEEPER_API_KEY}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      - CIRCUIT_BREAKER_COOLDOWN=${CIRCUIT_BREAKER_COOLDOWN:-10s}
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9090/-/healthy",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
